{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Your Email — Harvest & Hearth</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #f7f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 4px 40px rgba(0,0,0,.08);
    }

    .icon-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(201,123,58,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: #C97B3A; margin-bottom: 24px; }

    .card-title { font-size: 22px; font-weight: 700; color: #1A0A00; margin-bottom: 12px; }
    .card-sub   { font-size: 14px; color: #777; line-height: 1.7; margin-bottom: 8px; }
    .card-sub strong { color: #1A0A00; }

    .hint {
      font-size: 12.5px;
      color: #aaa;
      margin-top: 20px;
      line-height: 1.6;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 28px;
      font-size: 13px;
      color: #C97B3A;
      text-decoration: none;
      font-weight: 700;
    }
    .back-home:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">☕ Harvest & Hearth</div>
    <div class="icon-circle">✉️</div>
    <div class="card-title">Check your email</div>
    <p class="card-sub">We've sent a password reset link to the email address you entered, if it matches an account in our system.</p>
    <p class="hint">Didn't get it? Check your spam folder, or wait a few minutes and try again.</p>

    <a href="{% url 'customer_login' %}" class="back-home">← Back to sign in</a>
  </div>

</body>
</html>
