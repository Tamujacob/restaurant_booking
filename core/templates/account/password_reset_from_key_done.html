{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Changed — Harvest & Hearth</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #f7f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 4px 40px rgba(0,0,0,.08);
    }

    .icon-circle {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(22,163,74,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }

    .logo { font-family: 'Playfair Display', serif; font-size: 20px; color: #C97B3A; margin-bottom: 24px; }

    .card-title { font-size: 22px; font-weight: 700; color: #1A0A00; margin-bottom: 12px; }
    .card-sub   { font-size: 14px; color: #777; line-height: 1.7; margin-bottom: 8px; }

    .btn-submit {
      display: inline-block;
      margin-top: 24px;
      padding: 13px 32px;
      background: #C97B3A;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Lato', sans-serif;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    .btn-submit:hover { background: #b56a2e; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">☕ Harvest & Hearth</div>
    <div class="icon-circle">✅</div>
    <div class="card-title">Password changed</div>
    <p class="card-sub">Your password has been updated successfully. You can now sign in with your new password.</p>

    <a href="{% url 'customer_login' %}" class="btn-submit">Sign in</a>
  </div>

</body>
</html>
